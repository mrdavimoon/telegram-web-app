<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Управление табло</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    button {
      font-size: 20px;
      margin: 10px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <h2>Управление табло</h2>
  <button onclick="sendStatus('Открыто')">Открыто</button>
  <button onclick="sendStatus('Перерыв 10 мин')">Перерыв 10 мин</button>
  <button onclick="sendStatus(prompt('Введите свой статус'))">Свой статус</button>

  <script>
    function sendStatus(text) {
      Telegram.WebApp.sendData(text);
    }
  </script>
</body>
</html>
